[versions]
# App Constants
packageName = "org.sopt.santamanitto"
minSdk = "23"
playServicesAds = "22.2.0"
targetSdk = "34"
compileSdk = "34"
versionCode = "19"
versionName = "2.1.1"
jvmVersion = "17"

# Build Tools
agp = "8.4.0"

# Kotlin Version
kotlin = "1.9.22"

# AndroidX
androidxCore = "1.12.0"
androidxAppcompat = "1.6.1"
androidxLifecycle = "2.7.0"
androidxNavigation = "2.7.7"
androidxConstraintLayout = "2.1.4"
androidxRecyclerview = "1.3.2"
androidxCardview = "1.0.0"
androidxSplashscreen = "1.0.1"

# Material
material = "1.11.0"

# Firebase
firebaseBom = "32.8.0"
firebaseCrashlytics = "3.0.3"

# Hilt
hilt = "2.46"

# Network
okhttp = "4.12.0"
retrofit = "2.11.0"

# Kotlin Extensions
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"

# Test
junit = "4.13.2"
mockito = "2.24.5"
mockitoInline = "2.13.0"
espresso = "3.5.1"
test-ext-junit = "1.1.3"

# Google
googleServices = "4.4.1"

# Taxonomy
amplitude = "1.17.3"

# etc
timber = "5.0.1"
lottie = "6.4.1"

[libraries]
# AndroidX
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidxNavigation" }
androidx-constraint-layout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintLayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "androidxCardview" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }

# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-config = { group = "com.google.firebase", name = "firebase-config-ktx" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Network
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
retrofit-bom = { group = "com.squareup.retrofit2", name = "retrofit-bom", version.ref = "retrofit" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization" }
okhttp-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor" }

# Kotlin Extensions
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-inline = { group = "org.mockito", name = "mockito-inline", version.ref = "mockitoInline" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext-junit" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# Taxonomy
amplitude = { group = "com.amplitude", name = "analytics-android", version.ref = "amplitude" }

# etc
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }

[bundles]
androidx = [
    "androidx-core",
    "androidx-appcompat",
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel",
    "androidx-navigation-fragment",
    "androidx-navigation-ui",
    "androidx-constraint-layout",
    "androidx-recyclerview",
    "androidx-cardview",
    "androidx-splashscreen"
]

firebase = [
    "firebase-analytics",
    "firebase-crashlytics",
    "firebase-config"
]

network = [
    "retrofit",
    "retrofit-converter-gson",
    "retrofit-serialization",
    "okhttp",
    "okhttp-logging-interceptor"
]

kotlin = [
    "kotlinx-serialization",
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android"
]

test = [
    "junit",
    "mockito-core",
    "mockito-inline",
]

android-test = [
    "androidx-test-ext-junit",
    "androidx-test-espresso"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "androidxNavigation" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }